dataset_id: plovdiv_agricultural_ml_2023_2025
dataset_version: "4.0.0"
pipeline_version: "4.0.0"
aoi_id: plovdiv_test

sources:
  satellite_dataset_id: plovdiv_2023_2025
  weather_dataset_id: plovdiv_weather_2023_2025
  soil_dataset_id: plovdiv_soil_2023_2025

area:
  name: plovdiv_test
  bbox: [24.65, 42.05, 24.68, 42.08]
  crs: EPSG:4326

period:
  start: "2023-01-01"
  end: "2025-12-31"
  timezone: UTC

issue_time:
  convention: beginning_of_utc_day
  clock: "00:00:00Z"
  last_complete_observation: D-1
  research_mode: research_reanalysis
  operational_availability_verified: false
  publication_timestamps_known: false

feature_windows_days: [1, 3, 7, 14, 30]
minimum_history_days: 30
dry_day_precipitation_mm: 1.0
api:
  k_factors: [0.85, 0.90, 0.95]
  warmup_days: 30
  initial: 0.0
  alignment: end_of_day_on_D-1

targets:
  variables:
    - swvl1
    - swvl2
    - swvl3
    - swvl4
    - theta_root_zone_0_100
  horizons_days: [1, 3, 7]
  aggregation: daily_mean_of_complete_utc_day
  change_baseline: last_complete_historical_day
  source_kind: modeled_reanalysis
  ground_truth: false

satellite:
  enabled: true
  max_age_days: 14
  alternative_max_age_days: 30
  quality_statuses: [valid]
  calibration_statuses: [verified]
  exclude_scene_quality: [rejected, requires_review]
  availability_assumption: acquisition_time_only_research
  operational_availability_verified: false
  fill_unobserved_days: false

static_properties:
  soil_texture: unavailable
  bulk_density: unavailable
  soil_organic_carbon: unavailable
  elevation: unavailable
  slope: unavailable
  land_cover: unavailable
  crop_identity: unavailable

splits:
  strategy: chronological_holdout
  training:
    start: "2023-01-01"
    end: "2023-12-31"
  validation:
    start: "2024-01-01"
    end: "2024-12-31"
  test:
    start: "2025-01-01"
    end: "2025-12-31"
  purge_target_crossing: true
  expanding_window:
    enabled: false
    initial_train_end: "2023-12-31"
    step_days: 365

null_policy:
  missing_stays_null: true
  never_fill_with_zero: true
  incomplete_windows_are_null: true

output:
  directory: data/processed/ml/plovdiv_agricultural_ml_2023_2025
  write_parquet: true
  write_modeling_samples: true

validation:
  fail_on_critical_leakage: true
  require_aligned_soil_weather_grid: true
  max_grid_distance_km: 0.01

experiments:
  A:
    name: weather_soil_history
    satellite: false
  B:
    name: weather_soil_satellite
    satellite: true
